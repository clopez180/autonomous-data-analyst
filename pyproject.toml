[project]
name = "autonomous-data-analyst"
version = "1.0.0"
description = "Give it a CSV and a question: a PydanticAI agent cleans the data, analyzes it, charts it and writes the report."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Carlos López" }]
dependencies = [
  "pydantic-ai-slim[anthropic,openai]>=1.0",  # openai = Groq / OpenRouter
  "pandas>=2.2",
  "matplotlib>=3.8",
  "tabulate>=0.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5"]

[project.scripts]
analyst = "data_analyst.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/data_analyst"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "BLE"]
ignore = ["E501"]  # line length is handled by `ruff format`
